plugins {
    id 'com.android.application'
}

android {
    namespace "com.thf.junsunshell"
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.thf.junsunshell"
        minSdk 21
        targetSdk 26
        versionCode 17
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	
	buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.6.1'
}

// Keep a copy of every debug build in apk_releases/, named by version
def releaseApkName = "JunSUnShell-${android.defaultConfig.versionName}-debug.apk"
def copyDebugApkToReleases = tasks.register('copyDebugApkToReleases', Copy) {
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(rootProject.layout.projectDirectory.dir('apk_releases'))
    rename { releaseApkName }
}
afterEvaluate {
    tasks.named('assembleDebug') { finalizedBy copyDebugApkToReleases }
}
